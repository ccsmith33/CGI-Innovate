name: project-sentinel
region: nyc
services:
  - name: backend
    source_dir: src/backend
    dockerfile_path: src/backend/Dockerfile
    http_port: 8000
    instance_size_slug: basic-xs
    instance_count: 1
    health_check:
      http_path: /health
    envs:
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
  - name: frontend
    source_dir: src/frontend
    dockerfile_path: src/frontend/Dockerfile
    http_port: 3000
    instance_size_slug: basic-xs
    instance_count: 1
    envs:
      - key: NEXT_PUBLIC_API_URL
        scope: BUILD_TIME
        value: ${backend.PUBLIC_URL}
databases:
  - name: db
    engine: PG
    version: "16"
    size: db-s-dev-database
    num_nodes: 1
